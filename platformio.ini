[platformio]
default_envs = m5stick-c-plus-se
; A1.9: all writable PlatformIO state is inside this project.
core_dir = .pio-local/core
packages_dir = .pio-local/packages
libdeps_dir = .pio-local/libdeps
cache_dir = .pio-local/cache

[env:m5stick-c-plus-se]
; setup_project_local.sh copies the already-verified offline platform into this project.
platform = symlink:///Volumes/yemol_HDDisk/HomeAIAgent_Mini/.pio-local/platforms/pioarduino-espressif32-55.03.37
board = m5stick-c
; PIOArduino 55.03.37 still maps m5stick-c to legacy variant "m5stick_c",
; but Arduino-ESP32 3.3.7 ships the StickC Plus pins as "m5stack_stickc_plus".
; StickC-Plus SE uses the Plus pin map, so override only the variant locally.
board_build.variant = m5stack_stickc_plus
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 1500000
board_build.partitions = huge_app.csv
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DHOMEAI_MINI_BUILD=1

; Libraries are installed into .pio-local/libdeps only.
lib_deps =
  https://github.com/m5stack/M5Unified.git#0.2.18
  https://github.com/m5stack/M5GFX.git#0.2.25
  https://github.com/Links2004/arduinoWebSockets.git#2.6.1
  https://github.com/bblanchon/ArduinoJson.git#v7.4.2
